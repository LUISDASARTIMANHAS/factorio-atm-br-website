<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mods expirados | Factorio Mod Browser</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="main-header py-4 text-center">
      <div class="container">
        <h1 class="display-5 text-uppercase tracking-wider">Mods expirados</h1>
        <p class="lead mb-3">Mods cujo cache precisa ser atualizado</p>
        <a href="./index.html" class="btn btn-outline-light btn-sm">Voltar aos mods</a>
      </div>
    </header>

    <main class="container py-5">
      <section aria-labelledby="expired-mods-heading">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <h2 id="expired-mods-heading" class="h3 mb-0">Lista completa</h2>
          <span class="badge status-badge p-3 fs-6">
            Total: <span id="expiredModsCount" class="text-primary fw-bold">0</span>
          </span>
        </div>

        <div id="expiredModsContainer" class="table-responsive">
          <div class="text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="text-uppercase tracking-wider">Carregando mods expirados...</p>
          </div>
        </div>

        <nav aria-label="Navegação de mods expirados" class="mt-4">
          <ul id="expiredPagination" class="pagination justify-content-center custom-pagination"></ul>
        </nav>
      </section>
    </main>

    <footer class="main-footer py-4 mt-auto text-center border-top">
      <div class="container small">
        <p class="mb-0">&copy; 2026 LUIS DAS ARTIMANHAS. Todos os direitos reservados.</p>
      </div>
    </footer>

    <script type="module" src="./expired.js"></script>
  </body>
</html>
