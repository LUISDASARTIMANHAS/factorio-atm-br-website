<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio Mod Browser V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="main-header py-4 text-center position-relative mb-4">
      <div class="container position-relative z-1">
        <h1 class="display-5 text-uppercase tracking-wider">Factorio Mod Browser V2</h1>
        <p class="lead mb-0">Sistema Avançado de Gerenciamento de Fábrica V2</p>
      </div>
    </header>

    <main class="container">
      <section class="control-panel p-4 mb-4" aria-label="Painel de Filtros">
        <div class="row g-3">
          <div class="col-md-12 col-lg-4">
            <label for="searchInput" class="form-label text-uppercase small  mb-1">Pesquisar</label>
            <input type="text" id="searchInput" class="form-control text-white" placeholder="Nome ou termo..." autocomplete="off" />
          </div>
          
          <div class="col-md-6 col-lg-3">
            <label for="categoryFilter" class="form-label text-uppercase small  mb-1">Categoria</label>
            <select id="categoryFilter" class="form-select text-white">
              <option value="all">Todas as Categorias</option>
              </select>
          </div>

          <div class="col-md-6 col-lg-3">
            <label for="sortFilter" class="form-label text-uppercase small  mb-1">Ordenar por</label>
            <select id="sortFilter" class="form-select text-white">
              <option value="downloads_desc">Mais Baixados</option>
              <option value="downloads_asc">Menos Baixados</option>
              <option value="recent">Mais Recentes</option>
              <option value="name_asc">Nome (A-Z)</option>
            </select>
          </div>

          <div class="col-md-12 col-lg-2 d-flex align-items-end justify-content-lg-end pt-2">
            <span class="badge status-badge p-2 w-100 text-center fs-6">
              Total: <span id="modsCarregados" class="text-primary fw-bold">0</span>
            </span>
          </div>
        </div>
      </section>

      <section aria-label="Lista de Mods">
        <div class="row g-4 mb-4" id="modsContainer">
          <div id="loading" class="col-12 text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class=" text-uppercase tracking-wider">Sincronizando banco de dados...</p>
          </div>
        </div>
      </section>

      <nav aria-label="Navegação de páginas de mods" class="mb-5">
        <ul class="pagination justify-content-center custom-pagination" id="paginationContainer">
          </ul>
      </nav>
    </main>

    <footer class="main-footer py-4 mt-auto text-center border-top">
      <div class="container  small">
        <p class="mb-2">&copy; 2026 LUIS DAS ARTIMANHAS. Todos os direitos reservados.</p>
        <nav aria-label="Links institucionais">
          <a href="./privacy.html" class=" mx-2 text-decoration-none hover-link">Privacidade</a> | 
          <a href="./terms.html" class=" mx-2 text-decoration-none hover-link">Termos de Uso</a> | 
          <a href="./cookies.html" class=" mx-2 text-decoration-none hover-link">Política de Cookies</a>
        </nav>
      </div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
