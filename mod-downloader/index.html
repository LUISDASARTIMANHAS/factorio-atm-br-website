<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio Mod Browser V2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="main-header py-4 text-center">
      <div class="container">
        <h1 class="display-5 text-uppercase tracking-wider">
          Factorio Mod Browser V2
        </h1>

        <p class="lead mb-0">Sistema Avançado de Gerenciamento de Fábrica V2</p>
      </div>
    </header>

    <main class="container-fluid px-4">
      <div class="row g-4">
        <!-- SIDEBAR -->
        <aside class="col-12 col-lg-3">
          <section
            class="control-panel p-4 sticky-lg-top"
            aria-label="Painel de Filtros"
          >
            <h2 class="h5 text-uppercase mb-4">Filtros</h2>

            <div class="mb-3">
              <label for="searchInput" class="form-label text-uppercase small">
                Pesquisar
              </label>

              <input
                type="text"
                id="searchInput"
                class="form-control text-white"
                placeholder="Nome ou termo..."
                autocomplete="off"
              />
            </div>

            <div class="mb-3">
              <label
                for="categoryFilter"
                class="form-label text-uppercase small"
              >
                Categoria
              </label>

              <select id="categoryFilter" class="form-select text-white">
                <option value="all">Todas as Categorias</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="sortFilter" class="form-label text-uppercase small">
                Ordenar por
              </label>

              <select id="sortFilter" class="form-select text-white">
                <option value="downloads_desc">Mais Baixados</option>

                <option value="downloads_asc">Menos Baixados</option>

                <option value="recent">Mais Recentes</option>

                <option value="name_asc">Nome (A-Z)</option>
              </select>
            </div>

            <div class="mt-4">
              <span class="badge status-badge p-3 w-100 fs-6">
                Total:
                <span id="modsCarregados" class="text-primary fw-bold">
                  0
                </span>
              </span>
            </div>
          </section>
        </aside>

        <!-- CONTEÚDO -->
        <section class="col-12 col-lg-9" aria-label="Lista de Mods">
          <div class="row g-4 mb-4" id="modsContainer">
            <div id="loading" class="col-12 text-center py-5">
              <div class="spinner-border text-primary mb-3" role="status"></div>

              <p class="text-uppercase tracking-wider">
                Sincronizando banco de dados...
              </p>
            </div>
          </div>

          <nav aria-label="Navegação de páginas" class="mb-5">
            <ul
              class="pagination justify-content-center custom-pagination"
              id="paginationContainer"
            ></ul>
          </nav>
        </section>
      </div>
    </main>

    <footer class="main-footer py-4 mt-auto text-center border-top">
      <div class="container small">
        <p class="mb-2">
          © 2026 LUIS DAS ARTIMANHAS. Todos os direitos reservados.
        </p>

        <nav aria-label="Links institucionais">
          <a href="./privacy.html" class="mx-2 text-decoration-none hover-link">
            Privacidade
          </a>

          |

          <a href="./terms.html" class="mx-2 text-decoration-none hover-link">
            Termos de Uso
          </a>

          |

          <a href="./cookies.html" class="mx-2 text-decoration-none hover-link">
            Política de Cookies
          </a>
        </nav>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./app.js"></script>
  </body>
</html>
