<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Mods do Factorio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .mod-list {
            margin-top: 20px;
        }
        .mod-item {
            background-color: #f9f9f9;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .mod-title {
            font-size: 20px;
            font-weight: bold;
        }
        .mod-description {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        .download-button {
            margin-top: 10px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .download-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pesquisa de Mods do Factorio</h1>

    <div>
        <input type="text" id="searchInput" placeholder="Pesquisar por nome de mod..." />
        <button onclick="searchMods()">Pesquisar</button>
        <button onclick="loadMods()">Carregar Todos os Mods</button>
    </div>

    <div id="modList" class="mod-list"></div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
  await loadMods();
});

    async function loadMods() {
  try {
    const response = await fetch("https://pingobras-factorio-server.glitch.me/mods");
    const data = await response.json();
    
    // Extraindo o array de 'results' e passando para displayMods
    displayMods(data.results);
  } catch (error) {
    console.error("Erro ao carregar os mods:", error);
  }
    }


async function searchMods() {
    try {
        const query = document.getElementById('searchInput').value;
        const response = await fetch(`https://pingobras-factorio-server.glitch.me/mods/${query}`);
        const mod = await response.json();

        // Verifique se a resposta é um objeto válido
        if (mod && mod.name) {
            displayMods([mod]);  // Envie como array contendo um único mod
        } else {
            console.error("A resposta da API não é um mod válido: ", mod);
            alert("Erro: Mod não encontrado ou inválido.");
        }
    } catch (error) {
        console.error("Erro ao buscar o mod: ", error);
        alert("Erro ao buscar o mod.");
    }
}

function displayMods(mods) {
    const modListDiv = document.getElementById('modList');
    modListDiv.innerHTML = '';

    // Verificar se mods é um array
    if (Array.isArray(mods)) {
        mods.forEach(mod => {
            const modDiv = document.createElement('div');
            modDiv.classList.add('mod-item');

            const modTitle = document.createElement('div');
            modTitle.classList.add('mod-title');
            modTitle.textContent = mod.name;

            const modDescription = document.createElement('div');
            modDescription.classList.add('mod-description');
            modDescription.textContent = mod.description || 'Sem descrição disponível.';

            const downloadButton = document.createElement('button');
            downloadButton.classList.add('download-button');
            downloadButton.textContent = 'Baixar';
            downloadButton.onclick = () => downloadMod(mod.name);

            modDiv.appendChild(modTitle);
            modDiv.appendChild(modDescription);
            modDiv.appendChild(downloadButton);

            modListDiv.appendChild(modDiv);
        });
    } else {
        console.error("Erro: A variável 'mods' não é um array válido.");
        alert("Erro: Dados inválidos para exibição.");
    }
}

function downloadMod(modName) {
    const url = `https://pingobras-factorio-server.glitch.me/download/mod/${modName}`;
    window.location.href = url; // Faz o download diretamente, sem abrir nova página
}

</script>

</body>
</html>
