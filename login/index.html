<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Refresh" content="120" />
    <meta name="viewport" content="width=device-width, initial-scale=0.7" />

    <link
      href="https://assets-mod.factorio.com/assets/086afd2a3fc08b60e4af3a054500f64f278a6946.png"
      rel="icon"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://www.factorio.com/static/css/main.css?v=87e4eb56"
    />

    <links></links>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./reset.css" />

    <title>LOGIN</title>
  </head>
  <body>
    <tela>
      <subtela>
        <h1 class="title-login">LOGIN FACTORIO</h1>
        <js id="msgError" class="msg-Error msg">Nenhum Erro Encontrado!</js>
        <js id="msgSuccess" class="msg-Success msg">Verificando...</js>
        <form id="form">
          <p vermelho>indica campos obrigatórios (*)</p>
          <label required for="email">Email</label>
          <input
            class="input-login"
            type="email"
            id="email"
            name="email"
            placeholder="Insira o seu e-mail"
            required
          />

          <button class="button button-green" type="submit">
            Enviar Código
          </button>
        </form>

        <form hidden id="formCode">
          <label required for="code">Código</label>
          <input
            type="number"
            id="code"
            placeholder="Insira o Código Enviado"
            required
          />

          <button class="button button-green" type="submit">Entrar</button>
        </form>

        <label for="continueConnected"> Permanecer conectado? </label>
        <input
          type="checkbox"
          id="continueConnected"
          name="continueConnected"
          checked
        />

        <button
          disabled
          class="button button-red"
          onclick="redirectUrl('../cadastro')"
        >
          Cadastrar
        </button>
      </subtela>

      <button class="button flex-space-between" onclick="redirectUrl('../')">
        Home
      </button>
    </tela>

    <footer>
      <div>
        <p class="p-title">Legenda:</p>
        <a class="button button-red">Indisponivel</a>
        <a class="button button-yellow">Prioridade</a>
        <a class="button button-green">Disponível </a>
        <a class="button flex-space-between">Normal</a>
      </div>
    </footer>

    <scripts>
      <script src="../src/js/links.js"></script>
      <script src="../src/js/offline.js" type="module" defer></script>
      <script src="../src/js/load-scripts.js" type="module" defer></script>
      <script src="./login.js" defer></script>
      <script
        type="module"
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
      ></script>
      <script
        nomodule
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
      ></script>
    </scripts>
    <autoscripts>
      <script
        src="https://luisdasartimanhas.github.io/PINGOBRAS/src/js/load-scripts.js"
        defer
      ></script>
    </autoscripts>
    <host>
      <script
        src="https://luisdasartimanhas.github.io/PINGOBRAS/src/js/load-host.js"
        defer
      ></script>
    </host>
  </body>
</html>
